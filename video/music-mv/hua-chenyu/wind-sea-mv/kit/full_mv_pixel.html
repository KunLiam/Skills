<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>风之海 — 华晨宇 像素RPG闯关 MV 完整版 (5:34)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a1020; }
    canvas { display: block; width: 1920px; height: 1080px; image-rendering: pixelated; }
  </style>
  <script src="lyrics.js"></script>
</head>
<body>
  <canvas id="c" width="1920" height="1080"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const W = 1920, H = 1080;
    const PLAYER_NAME = new URLSearchParams(location.search).get("player") || "追风少年";

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, u) => a + (b - a) * u;
    const ease = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
    const easeOut = (u) => { u = clamp(u, 0, 1); return 1 - Math.pow(1 - u, 3); };
    const easeIn = (u) => { u = clamp(u, 0, 1); return u * u * u; };
    const rnd = (seed) => {
      const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
      return x - Math.floor(x);
    };

    const ASSETS = {
      s1:  "assets_px/px_wind_s1_pier_cloudsea.png",
      s2:  "assets_px/px_wind_s2_cloud_sunset.png",
      s3:  "assets_px/px_wind_s3_wind_corridor.png",
      s4:  "assets_px/px_wind_s4_twilight_dusk.png",
      s5:  "assets_px/px_wind_s5_windmill_hill.png",
      s6:  "assets_px/px_wind_s6_sky_ocean_waves.png",
      s7:  "assets_px/px_wind_s7_island_campfire.png",
      s8:  "assets_px/px_wind_s8_misty_city_edge.png",
      s9:  "assets_px/px_wind_s9_moonlit_attic.png",
      s10: "assets_px/px_wind_s10_aurora_breakthrough.png",
      s11: "assets_px/px_wind_s11_cloud_stairway_dawn.png",
      s12: "assets_px/px_wind_s12_sky_flower_meadow.png",
      s13: "assets_px/px_wind_s13_grand_sea_of_wind.png"
    };
    const IMGS = {};
    function loadAll() {
      return Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => { IMGS[k] = im; res(); };
        im.onerror = () => rej(new Error("Failed to load " + src));
        im.src = src;
      })));
    }

    function rrect(x, y, w, h, r) {
      x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawBgPlate(img, scale, dx, dy, dimAlpha) {
      if (!img) return;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      const iw = img.naturalWidth || 1920, ih = img.naturalHeight || 1080;
      const base = Math.max(W / iw, H / ih) * scale;
      const dw = iw * base, dh = ih * base;
      ctx.drawImage(img, Math.round((W - dw) / 2 + dx), Math.round((H - dh) / 2 + dy), Math.round(dw), Math.round(dh));
      if (dimAlpha > 0) {
        ctx.fillStyle = `rgba(10, 14, 28, ${dimAlpha})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    function px(ox, oy, ps, gx, gy, gw, gh, col) {
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(ox + gx * ps), Math.round(oy + gy * ps), Math.round(gw * ps), Math.round(gh * ps));
    }

    // ── 4-Frame Smooth Pixel Pinwheel (小小风车) ──
    function drawPixelPinwheel(cx, cy, ps, frameIdx) {
      const f = ((frameIdx % 4) + 4) % 4;
      const cols = ["#ffe49c", "#7ef4ff", "#ff9eb5", "#96f2b4"];
      const c0 = cols[f], c1 = cols[(f + 1) % 4], c2 = cols[(f + 2) % 4], c3 = cols[(f + 3) % 4];
      px(cx, cy, ps, -3, -1, 3, 2, c0); px(cx, cy, ps, -2, -2, 2, 1, c0);
      px(cx, cy, ps,  0, -3, 2, 3, c1); px(cx, cy, ps,  2, -2, 1, 2, c1);
      px(cx, cy, ps,  1,  0, 3, 2, c2); px(cx, cy, ps,  1,  2, 2, 1, c2);
      px(cx, cy, ps, -1,  1, 2, 3, c3); px(cx, cy, ps, -2,  1, 1, 2, c3);
      px(cx, cy, ps,  0,  0, 1, 1, "#ffffff");
    }

    // ── Expressive Pixel Emote Bubble ──
    function drawEmoteBubble(cx, cy, symbol, accent, alpha) {
      if (alpha <= 0.02) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      const bx = Math.round(cx - 24), by = Math.round(cy - 24);
      rrect(bx, by, 48, 40, 8);
      ctx.fillStyle = "rgba(12, 18, 34, 0.92)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = accent;
      ctx.stroke();
      ctx.fillStyle = accent;
      ctx.fillRect(Math.round(cx - 4), by + 40, 8, 5);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '800 22px "PingFang SC", sans-serif';
      ctx.fillStyle = accent;
      ctx.fillText(symbol, Math.round(cx), by + 20);
      ctx.restore();
    }

    // ── Detailed 32-bit Pixel Traveler Sprite (supports grown traveler OR golden "小小孩" kid variant!) ──
    function drawPixelPlayer(cx, cy, ps, t, pose = "idle", alpha = 1, tint = null, isKid = false) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const ox = Math.round(cx), oy = Math.round(cy);
      const step = Math.floor(t * 9.0) % 4;
      const bob = pose === "run" ? (step % 2 === 1 ? -1 : 0) : pose === "float" ? Math.round(Math.sin(t * 3.2) * 1.3) : 0;
      const by = oy + bob * ps;
      const windWave = Math.floor(t * 10) % 4;

      if (pose === "idle" || pose === "run" || pose === "reach" || pose === "sit") {
        ctx.fillStyle = "rgba(8, 12, 26, 0.48)";
        ctx.fillRect(ox - 6 * ps, oy - 1 * ps, 12 * ps, 2 * ps);
      }

      // Dynamic scarf (cyan for traveler, warm golden-rose for Little Kid!)
      const scLen = pose === "glide" ? 12 : pose === "run" || pose === "jump" ? 9 : 6;
      const scSpd = pose === "glide" ? 14 : 8.5;
      for (let i = 0; i < scLen; i++) {
        const sy = -15 + Math.round(Math.sin(t * scSpd - i * 0.65) * (pose === "glide" ? 1.6 : 1.1));
        const col = tint || (isKid
          ? (i % 2 === 0 ? "#ffd878" : "#ffb8c6")
          : (i < 3 ? "#9cf8ff" : i % 2 === 0 ? "#7ee8ff" : "#e6fbff"));
        px(ox, by, ps, -4 - i, sy, 2, i > scLen - 3 ? 1 : 2, col);
      }

      const ol = tint || "#10172a";
      px(ox, by, ps, -5, -24, 10, 8, ol);
      px(ox, by, ps, -6, -16, 12, 10, ol);

      // Hair
      px(ox, by, ps, -4, -23, 8, 3, tint || (isKid ? "#3a2824" : "#1c2c52"));
      px(ox, by, ps, -3, -23, 5, 1, tint || (isKid ? "#6e4c3a" : "#3a568e"));
      px(ox, by, ps, -5, -21, 2, 4, tint || (isKid ? "#3a2824" : "#1c2c52"));
      px(ox, by, ps, -6 - (windWave % 2), -20, 2, 2, tint || (isKid ? "#4f372e" : "#283f72"));
      px(ox, by, ps,  3, -21, 1, 2, tint || (isKid ? "#3a2824" : "#1c2c52"));

      // Face
      px(ox, by, ps, -3, -20, 6, 4, tint || "#ffe2c8");
      px(ox, by, ps,  1, -19, 1, 2, tint || "#121a30");
      px(ox, by, ps,  2, -17, 1, 1, tint || "#f7a8b0");

      // Scarf collar & jacket
      px(ox, by, ps, -4, -16, 8, 2, tint || (isKid ? "#ffd878" : "#8cf8ff"));
      px(ox, by, ps, -3, -15, 6, 1, tint || "#fff6dc");
      px(ox, by, ps, -5, -14, 10, 7, tint || (isKid ? "#fff3d6" : "#f8f4ea"));
      px(ox, by, ps, -2, -14, 4, 6, tint || (isKid ? "#ff9eb5" : "#5db8e8"));
      px(ox, by, ps, -5, -8, 10, 1, tint || "#ffd878");
      px(ox, by, ps, -6 - (pose === "glide" ? 2 : 0), -11, 2, 4, tint || (isKid ? "#ffe4a8" : "#dbeeff"));

      // Legs
      if (pose === "sit") {
        px(ox, by, ps, -3, -6, 6, 3, tint || "#22345c");
        px(ox, by, ps,  3, -5, 4, 2, tint || "#182646");
        px(ox, by, ps,  6, -5, 2, 2, tint || "#faf8f4");
      } else if (pose === "run") {
        const l1 = step === 0 ? -4 : step === 2 ? 2 : -1;
        const l2 = step === 0 ?  2 : step === 2 ? -4 : 0;
        px(ox, by, ps, l1, -6, 2, 5, tint || "#22345c"); px(ox, by, ps, l1, -1, 3, 1, tint || "#faf8f4");
        px(ox, by, ps, l2, -6, 2, 5, tint || "#182646"); px(ox, by, ps, l2, -1, 3, 1, tint || "#faf8f4");
      } else if (pose === "jump" || pose === "glide") {
        px(ox, by, ps, -5, -6, 3, 4, tint || "#22345c"); px(ox, by, ps, -6, -2, 3, 1, tint || "#faf8f4");
        px(ox, by, ps,  1, -5, 3, 3, tint || "#182646"); px(ox, by, ps,  2, -2, 3, 1, tint || "#faf8f4");
      } else {
        px(ox, by, ps, -3, -6, 2, 5, tint || "#22345c"); px(ox, by, ps, -3, -1, 3, 1, tint || "#faf8f4");
        px(ox, by, ps,  1, -6, 2, 5, tint || "#182646"); px(ox, by, ps,  1, -1, 3, 1, tint || "#faf8f4");
      }

      // Arms & Pinwheel
      if (pose === "reach") {
        px(ox, by, ps, 4, -14, 6, 2, tint || "#f8f4ea"); px(ox, by, ps, 10, -14, 2, 2, tint || "#ffe2c8");
        px(ox, by, ps, 3, -11, 6, 2, tint || "#dbeeff"); px(ox, by, ps,  9, -11, 2, 2, tint || "#ffe2c8");
      } else if (pose !== "no_prop") {
        px(ox, by, ps, 4, -14, 2, 3, tint || "#f8f4ea");
        px(ox, by, ps, 5, -21, 1, 9, tint || "#ffd878");
        if (!tint) drawPixelPinwheel(ox + 5 * ps, by - 22 * ps, ps, Math.floor(t * (pose === "glide" ? 18 : 8)));
      }
      ctx.restore();
    }

    function drawPixelPuff(cx, cy, u, color = "#fff4df") {
      if (u <= 0 || u >= 1) return;
      ctx.save();
      ctx.globalAlpha = (1 - u) * 0.85;
      for (let i = 0; i < 6; i++) {
        const ang = -Math.PI + (i / 5) * Math.PI;
        const r = 12 + u * 52;
        const sz = Math.max(4, Math.round(12 * (1 - u * 0.6)));
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(cx + Math.cos(ang) * r), Math.round(cy + Math.sin(ang) * r * 0.45), sz, sz);
      }
      ctx.restore();
    }

    function drawParallaxForegroundClouds(t, speed, tint, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      for (let i = 0; i < 6; i++) {
        const w = 260 + Math.round(rnd(i * 17.3) * 180);
        const x = Math.round((((i * 420 - t * speed) % (W + 500)) + (W + 500)) % (W + 500) - 250);
        const y = H - 72 + Math.round(rnd(i * 9.1) * 34);
        ctx.fillStyle = tint;
        ctx.fillRect(x, y, w, 90);
        ctx.fillRect(x + 36, y - 22, w - 72, 26);
        ctx.fillRect(x + 84, y - 38, w - 168, 20);
      }
      ctx.restore();
    }

    function drawPixelCloudPlatform(cx, cy, w, glow = false) {
      const x = Math.round(cx - w / 2), y = Math.round(cy);
      ctx.save();
      if (glow) {
        ctx.fillStyle = "rgba(255, 220, 140, 0.24)";
        ctx.fillRect(x - 10, y - 16, w + 20, 44);
      }
      ctx.fillStyle = "rgba(22, 32, 62, 0.55)"; ctx.fillRect(x + 10, y + 20, w - 20, 10);
      ctx.fillStyle = "#e6cbb8"; ctx.fillRect(x + 6, y + 8, w - 12, 14);
      ctx.fillStyle = "#fff8ec";
      ctx.fillRect(x, y, w, 12);
      ctx.fillRect(x + 16, y - 10, w - 32, 12);
      ctx.fillRect(x + 40, y - 16, w - 80, 8);
      ctx.fillStyle = "#ffd98c"; ctx.fillRect(x + 12, y + 12, w - 24, 4);
      ctx.restore();
    }

    function drawPixelWindSpirit(cx, cy, t, dissolve = 0, alpha = 1) {
      ctx.save();
      ctx.globalAlpha = alpha;
      const ox = Math.round(cx), oy = Math.round(cy);
      if (dissolve < 0.92) {
        for (let i = 0; i < 22; i++) {
          const pxPos = Math.round(ox - i * 13 - dissolve * i * 6);
          const pyPos = Math.round(oy + Math.sin(t * 5.2 - i * 0.4) * (14 + i * 1.1));
          const sz = Math.max(4, Math.round((15 - i * 0.55) * (1 - dissolve)));
          ctx.fillStyle = i % 3 === 0 ? "#ffe69c" : "#8cf8ff";
          ctx.globalAlpha = alpha * (1 - i / 24) * (1 - dissolve);
          ctx.fillRect(pxPos - Math.floor(sz / 2), pyPos - Math.floor(sz / 2), sz, sz);
        }
        const cs = Math.round(24 * (1 - dissolve));
        ctx.globalAlpha = alpha * (1 - dissolve);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(ox - cs / 2, oy - cs / 2, cs, cs);
        ctx.strokeStyle = "#8cf8ff";
        ctx.lineWidth = 4;
        ctx.strokeRect(ox - cs / 2 - 5, oy - cs / 2 - 5, cs + 10, cs + 10);
      }
      if (dissolve > 0.01) {
        for (let i = 0; i < 64; i++) {
          const ang = rnd(i * 19.1) * Math.PI * 2;
          const spd = 60 + rnd(i * 33.7) * 380;
          const dpx = Math.round(ox + Math.cos(ang) * spd * dissolve + dissolve * 260);
          const dpy = Math.round(oy + Math.sin(ang) * spd * dissolve - dissolve * 130 + Math.sin(t * 4 + i) * 10);
          const sz = i % 4 === 0 ? 9 : i % 2 === 0 ? 6 : 4;
          ctx.globalAlpha = alpha * clamp(1 - dissolve * 0.65, 0, 1);
          ctx.fillStyle = i % 3 === 0 ? "#ffb8c6" : i % 2 === 0 ? "#8cf8ff" : "#ffe49c";
          ctx.fillRect(dpx, dpy, sz, sz);
        }
      }
      ctx.restore();
    }

    function drawPixelMotes(t, count, speedX, alpha, colorA = "#ffe49c", colorB = "#8cf8ff") {
      ctx.save();
      for (let i = 0; i < count; i++) {
        const s1 = rnd(i * 11.3 + 2), s2 = rnd(i * 23.7 + 5), s3 = rnd(i * 7.1 + 9);
        const x = Math.round(((s1 * W + t * speedX * (0.6 + s3)) % (W + 80) + (W + 80)) % (W + 80) - 40);
        const y = Math.round(((s2 * H - t * (10 + s3 * 18) + Math.sin(t * 2 + i) * 18) % (H + 60) + (H + 60)) % (H + 60) - 30);
        const sz = s3 > 0.68 ? 6 : 4;
        ctx.globalAlpha = alpha * (0.4 + 0.6 * Math.abs(Math.sin(t * 2.5 + i)));
        ctx.fillStyle = i % 3 === 0 ? colorB : colorA;
        ctx.fillRect(x, y, sz, sz);
      }
      ctx.restore();
    }

    function drawCloudWipe(t, at, colorMain, colorEdge) {
      const dt = t - at;
      if (Math.abs(dt) > 0.52) return;
      const u = (dt + 0.52) / 1.04;
      const cx = Math.round(lerp(W + 320, -320, ease(u)));
      ctx.save();
      for (let row = 0; row < 12; row++) {
        const rx = cx + Math.round(Math.sin(row * 1.7) * 90);
        const ry = row * 94 - 10;
        ctx.fillStyle = colorEdge; ctx.fillRect(rx - 220, ry, 440, 102);
        ctx.fillStyle = colorMain; ctx.fillRect(rx - 150, ry + 8, 300, 86);
      }
      ctx.restore();
    }

    function drawToastBanner(cy, title, sub, borderCol, titleCol, alpha) {
      if (alpha <= 0.02) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      const bw = 620, bh = 92;
      const bx = Math.round(W / 2 - bw / 2), by = Math.round(cy - bh / 2);
      rrect(bx, by, bw, bh, 12);
      ctx.fillStyle = "rgba(10, 15, 28, 0.93)";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = borderCol;
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '800 24px "PingFang SC", sans-serif';
      ctx.fillStyle = titleCol;
      ctx.fillText(title, W / 2, by + 32);
      ctx.font = '600 18px "PingFang SC", sans-serif';
      ctx.fillStyle = "#e6eefc";
      ctx.fillText(sub, W / 2, by + 66);
      ctx.restore();
    }

    // ── Evolving Global Pixel RPG HUD + Full-Song Journey Mini-Map ──
    function drawGameHUD(t) {
      if (t < 15.7 || t > 304.2) return;
      const a = easeOut(clamp((t - 15.7) / 0.5, 0, 1)) * clamp((304.2 - t) / 0.8, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;

      let lv = "LV.01", stageTag = "STAGE 01 · 云海拾忆", goal = "收集记忆碎片", purity = 100, windKmh = 24;
      if (t < 27.2) {
        const s = t < 18.2 ? 0 : t < 21.2 ? 1 : t < 24.4 ? 2 : 3;
        goal = `收集记忆碎片 (${s}/3)`; windKmh = Math.round(lerp(14, 26, (t - 15.9) / 11.3));
      } else if (t < 33.08) {
        stageTag = "STAGE 01 · 踏云看日落"; goal = "已解锁坐骑：[日落云朵]"; windKmh = 22;
      } else if (t < 39.36) {
        lv = "LV.03"; stageTag = "STAGE 02 · 幻想气流冲浪";
        windKmh = Math.round(lerp(28, 72, ease((t - 33.08) / 6.28)));
        goal = `冲破幻想气流 · 风速 ${windKmh} km/h`;
      } else if (t < 51.74) {
        lv = "LV.04"; stageTag = "STAGE 03 · 迟钝伸手";
        windKmh = Math.round(lerp(56, 0, easeOut((t - 39.36) / 3.2)));
        goal = windKmh > 2 ? "QTE：长按留住风之灵" : "风不屑被谁所有……";
      } else if (t < 77.76) {
        lv = "LV.08"; stageTag = "STAGE 04 · 风车山丘";
        goal = "点亮风之音符灯 · 追寻歌声"; windKmh = 36;
      } else if (t < 102.0) {
        lv = "LV.12"; stageTag = "STAGE 05 · 碧海踏风";
        goal = "乘风破浪 · 守护小小风车"; windKmh = 68;
      } else if (t < 115.49) {
        lv = "LV.15"; stageTag = "REST · 浮空岛营火";
        goal = "CHAPTER II 加载中……"; windKmh = 12;
      } else if (t < 140.15) {
        lv = "LV.22"; stageTag = "STAGE 06 · 宽广世界迷途";
        purity = Math.round(lerp(95, 42, ease((t - 115.49) / 24.6)));
        goal = "穿越人群孤立 · 找回纯粹轮廓"; windKmh = 18;
      } else if (t < 166.15) {
        lv = "LV.25"; stageTag = "STAGE 07 · 旅人的行囊";
        purity = Math.round(lerp(42, 86, ease(clamp((t - 148) / 14, 0, 1))));
        goal = "打开背包 · 重拾年少风车"; windKmh = 20;
      } else if (t < 192.0) {
        lv = "LV.32"; stageTag = "STAGE 08 · 极光破云";
        purity = 100; windKmh = 82;
        goal = "解除执念 · 学会如你般自由";
      } else if (t < 216.56) {
        lv = "LV.38"; stageTag = "BRIDGE · 云端天梯";
        goal = "拾级而上 · 重逢「小小孩」"; windKmh = 30;
      } else if (t < 243.37) {
        lv = "LV.45"; stageTag = "STAGE 09 · 花海欢唱";
        goal = "与小小孩同行 · 欢唱呼唤微风"; windKmh = 54;
      } else if (t < 272.0) {
        lv = "LV.MAX"; stageTag = "FINAL · 找到风的海";
        goal = "🏆 TRUE ENDING · 你本身就是风的海"; windKmh = 99;
      } else {
        lv = "LV.MAX"; stageTag = "OUTRO · 回归日落栈道";
        goal = "放下风车 · 拥抱自由微风"; windKmh = 16;
      }

      // Top-left Player Status Card
      rrect(36, 26, 404, 94, 10);
      ctx.fillStyle = "rgba(10, 15, 28, 0.90)";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = t >= 243.37 ? "#ffd878" : purity < 60 ? "#7c98c8" : "rgba(255, 216, 120, 0.72)";
      ctx.stroke();

      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.font = '700 24px "PingFang SC", sans-serif'; ctx.fillStyle = "#faf8f4";
      ctx.fillText(`${PLAYER_NAME}  ${lv}`, 58, 54);
      ctx.textAlign = "right";
      ctx.font = '700 20px "DIN Alternate", "PingFang SC", sans-serif'; ctx.fillStyle = "#ffd878";
      ctx.fillText(`💨 ${windKmh} km/h`, 420, 54);

      ctx.textAlign = "left";
      ctx.font = '600 14px "PingFang SC", sans-serif'; ctx.fillStyle = purity < 60 ? "#ff9eb5" : "#8cf8ff";
      ctx.fillText(`纯真度 ${purity}%`, 58, 92);
      rrect(144, 84, 274, 14, 4);
      ctx.fillStyle = "rgba(255,255,255,0.14)"; ctx.fill();
      rrect(144, 84, Math.round(274 * (purity / 100)), 14, 4);
      ctx.fillStyle = purity < 60 ? "#ff8fa0" : t >= 243.37 ? "#ffd878" : "#66f09a";

      { id: "s5",   start: 77.76,  end: 102.00, fn: renderStage5 },
      { id: "int1", start: 102.00, end: 115.49, fn: renderInterlude1 },
      { id: "s6",   start: 115.49, end: 140.15, fn: renderStage6 },
      { id: "s7",   start: 140.15, end: 166.15, fn: renderStage7 },
      { id: "s8",   start: 166.15, end: 192.00, fn: renderStage8 },
      { id: "int2", start: 192.00, end: 216.56, fn: renderInterlude2 },
      { id: "s9",   start: 216.56, end: 243.37, fn: renderStage9 },
      { id: "s10",  start: 243.37, end: 272.00, fn: renderStage10 },
      { id: "out",  start: 272.00, end: 335.00, fn: renderOutro }
    ];
    const XFADE = 0.45;

    window.renderAt = function (t) {
      ctx.fillStyle = "#0a1020";
      ctx.fillRect(0, 0, W, H);

      for (let i = 0; i < STAGES.length; i++) {
        const st = STAGES[i];
        if (t < st.start - XFADE || t > st.end + XFADE) continue;
        let a = 1;
        if (i > 0 && t < st.start + XFADE) a = ease((t - (st.start - XFADE)) / (XFADE * 2));
        else if (i < STAGES.length - 1 && t > st.end - XFADE) a = 1 - ease((t - (st.end - XFADE)) / (XFADE * 2));
        if (a > 0.005) st.fn(t, a);
      }

      // Diegetic Pixel Cloud-Curtain Wipes on major musical transitions
      drawCloudWipe(t, 15.91,  "rgba(255, 244, 224, 0.94)", "rgba(255, 212, 146, 0.65)");
      drawCloudWipe(t, 33.08,  "rgba(218, 250, 255, 0.92)", "rgba(126, 244, 255, 0.62)");
      drawCloudWipe(t, 39.36,  "rgba(42, 54, 96, 0.90)",    "rgba(255, 178, 200, 0.52)");
      drawCloudWipe(t, 51.74,  "rgba(255, 236, 190, 0.92)", "rgba(255, 200, 120, 0.60)");
      drawCloudWipe(t, 77.76,  "rgba(200, 248, 255, 0.92)", "rgba(126, 244, 255, 0.62)");
      drawCloudWipe(t, 115.49, "rgba(38, 48, 78, 0.92)",    "rgba(120, 148, 196, 0.55)");
      drawCloudWipe(t, 166.15, "rgba(190, 250, 255, 0.94)", "rgba(255, 224, 150, 0.64)");
      drawCloudWipe(t, 216.56, "rgba(255, 246, 218, 0.92)", "rgba(255, 212, 140, 0.62)");
      drawCloudWipe(t, 243.37, "rgba(220, 252, 255, 0.94)", "rgba(255, 226, 156, 0.66)");

      drawGameHUD(t);
      drawLyrics(t);

      // Gentle fade to deep twilight at end (332.5–334.45s)
      if (t > 332.5) {
        ctx.fillStyle = `rgba(10, 14, 28, ${ease((t - 332.5) / 1.95) * 0.78})`;
        ctx.fillRect(0, 0, W, H);
      }
      return canvas.toDataURL("image/jpeg", 0.92);
    };

    window.sceneReady = false;
    loadAll().then(() => { window.sceneReady = true; }).catch((e) => console.error(e));
  </script>
