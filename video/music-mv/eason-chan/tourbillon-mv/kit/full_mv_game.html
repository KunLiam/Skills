    function lerp(a, b, u) { return a + (b - a) * u; }
    function ease(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
    function easeOut(u) { u = clamp(u, 0, 1); return 1 - Math.pow(1 - u, 3); }

    function rrect(x, y, w, h, r) {
      x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawBgPlate(img, sc, px, py, dim = 0.22) {
      const dw = W * sc, dh = H * sc;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, (W - dw) / 2 + px, (H - dh) / 2 + py, dw, dh);
      if (dim > 0) {
        ctx.fillStyle = `rgba(8, 10, 20, ${dim})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    function drawRain(t, count, heavy = true) {
      ctx.save();
      ctx.strokeStyle = heavy ? "rgba(150, 220, 255, 0.24)" : "rgba(255, 190, 230, 0.16)";
      ctx.lineWidth = heavy ? 1.8 : 1.2;
      for (let i = 0; i < count; i++) {
        const rx = ((rnd(i * 29) * W - t * (heavy ? 180 : 90)) % W + W) % W;
        const ry = ((rnd(i * 53) * H + t * (heavy ? 640 : 420)) % H);
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 6, ry + (heavy ? 26 : 18)); ctx.stroke();
      }
      ctx.restore();
    }

    function drawKunZai(x, yFoot, opts = {}) {
      const sc = opts.scale || 6;
      const age = opts.age || 0; // 0: 18yo, 1: 27yo, 2: 38yo charcoal coat, 3: 55yo silver hair camel coat
      const pose = opts.pose || "stand";
      const t = opts.t || 0;
      const flip = !!opts.flip;
      const rim = opts.rim || (age === 0 || age === 3 ? "#ffd878" : "#76e4ff");
      const alpha = opts.alpha !== undefined ? opts.alpha : 1;

      let key = "stand", bobY = 0;
      if (pose === "run") {
        key = Math.floor(t * 10) % 2 === 0 ? "runA" : "runB";
        bobY = -Math.round(Math.abs(Math.sin(t * 10 * Math.PI)) * 6);
      } else if (pose === "jump") {
        key = "jump";
      } else if (pose === "type") {
        key = "type";
        bobY = Math.round(Math.sin(t * 18) * 2);
      } else {
        bobY = Math.round(Math.sin(t * 3) * 2);
      }

      const rows = SPRITES[key];
      const wCols = rows[0].length;
      const wPx = wCols * sc, hPx = rows.length * sc;
      const x0 = Math.round(x - wPx / 2);
      const y0 = Math.round(yFoot - hPx + bobY);

      let pal;
      if (age === 0) {
        pal = {
          O: "#0c0b12", H: "#181924", h: "#2a3248", L: "#58688c",
          S: "#f2c6a6", s: "#c89474", E: "#0c0b12",
          J: "#3e669a", j: "#264066", B: "#6c9ed4",
          W: "#f4f6fa", w: "#c8d0dc", T: "#9a2232",
          D: "#384c74", d: "#22304c", K: "#f6eed8", k: "#8a92a4", R: rim
        };
      } else if (age === 1) {
        pal = {
          O: "#0c0b12", H: "#181924", h: "#282e3e", L: "#62708a",
          S: "#ecc4a4", s: "#b88a6c", E: "#0c0b12",
          J: "#22283a", j: "#161a26", B: "#3c4864",
          W: "#eef2f8", w: "#bcc6d6", T: "#c82c3e",
          D: "#222838", d: "#141824", K: "#2c2e38", k: "#0c0b12", R: rim
        };
      } else if (age === 2) {
        pal = {
          O: "#0c0b12", H: "#262834", h: "#4e5264", L: "#b4bac8",
          S: "#e8be9e", s: "#b08466", E: "#0c0b12",
          J: "#1c1e2a", j: "#10121c", B: "#4a4e64",
          W: "#f6eed8", w: "#c8c0b2", T: "#d8384e",
          D: "#181a24", d: "#10121a", K: "#24242c", k: "#0c0b12", R: rim
        };
      } else {
        pal = {
          O: "#0c0b12", H: "#b6bcc8", h: "#8890a2", L: "#faf8f4",
          S: "#e4bc9c", s: "#ae8468", E: "#0c0b12",
          J: "#a88056", j: "#785838", B: "#d4ae7e",
          W: "#f6eed8", w: "#c6bca8", T: "#5e4c3e",
          D: "#3e404e", d: "#282a36", K: "#4e382a", k: "#261a14", R: rim
        };

      ctx.save();
      ctx.globalAlpha = alpha;
      if (opts.shadow !== false) {
        ctx.fillStyle = "rgba(6, 6, 14, 0.55)";
        ctx.beginPath();
        ctx.ellipse(Math.round(x), Math.round(yFoot - 2), wPx * 0.36, 9, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        for (let c = 0; c < wCols; c++) {
          const ch = row[c];
          if (ch === ".") continue;
          const col = pal[ch];
          if (!col) continue;
          const dc = flip ? (wCols - 1 - c) : c;
          ctx.fillStyle = col;
          ctx.fillRect(x0 + dc * sc, y0 + r * sc, sc, sc);
        }
      }
      if (opts.skateboard) {
        const rx = Math.round(x), ry = Math.round(yFoot);
        ctx.fillStyle = "#e85468";
        rrect(rx - 54, ry - 12, 108, 12, 5);
        ctx.fill();
        ctx.fillStyle = "#ffd878";
        ctx.fillRect(rx - 38, ry - 10, 76, 4);
        ctx.fillStyle = "#222634";
        ctx.beginPath(); ctx.arc(rx - 32, ry + 4, 8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(rx + 32, ry + 4, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#6ee6ff";
        ctx.beginPath(); ctx.arc(rx - 32, ry + 4, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(rx + 32, ry + 4, 3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function drawFloatText(x, y, text, color, alpha, size = 26) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.font = `700 ${size}px "PingFang SC", "DIN Alternate", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "rgba(8, 8, 16, 0.92)";
      ctx.strokeText(text, Math.round(x), Math.round(y));
      ctx.fillStyle = color;
      ctx.fillText(text, Math.round(x), Math.round(y));
      ctx.restore();
    }

    function drawOrb(x, y, r, color, core = "#fffbe6") {
      x = Math.round(x); y = Math.round(y);
      ctx.save();
      const g = ctx.createRadialGradient(x, y, 2, x, y, r * 2.2);
      g.addColorStop(0, color);
      g.addColorStop(1, "rgba(255, 210, 90, 0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.42, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawFullECG(yMid, t, alive = true, alpha = 0.88) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 3.2;
      ctx.strokeStyle = alive ? "#ff4d63" : "#7e8aa2";
      ctx.shadowColor = alive ? "rgba(255, 70, 95, 0.9)" : "rgba(120, 140, 170, 0.4)";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) {
        let dy = 0;
        if (alive) {
          const ph = ((x + t * 280) % 260) / 260;
          if (ph > 0.42 && ph < 0.46) dy = -26;
          else if (ph >= 0.46 && ph < 0.50) dy = 34;
          else if (ph >= 0.50 && ph < 0.54) dy = -92;
          else if (ph >= 0.54 && ph < 0.58) dy = 48;
          else if (ph >= 0.58 && ph < 0.65) dy = -18;
        }
        if (x === 0) ctx.moveTo(x, yMid + dy);
        else ctx.lineTo(x, yMid + dy);
      }
      ctx.stroke();
      ctx.restore();
    }

      ctx.fillStyle = "rgba(14, 10, 20, 0.90)";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = isDead ? "#7e8aa2" : "#ff5c72";
      ctx.stroke();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = '800 22px "PingFang SC", sans-serif';
      ctx.fillStyle = isDead ? "#9aa4b8" : "#ff7286";
      ctx.fillText("FINAL BOSS · 黄金陀飞轮（无法战胜的时间）", W / 2, 156);
      rrect(W / 2 - 320, 178, 640, 14, 7);
      ctx.fillStyle = isDead ? "#5c6476" : "#ff445e";
      ctx.fill();

      // Dramatic full-width ECG heartbeat -> FLATLINES at 211.0s!
      drawFullECG(540, t, !isDead, 0.92);

      // Failed command attempts ("上链 -> MISS", "加钱 -> 无效") before 211s
      if (!isDead) {
        const atk = Math.floor(lt / 4.5) % 2;
        const sub = (lt % 4.5);
        if (sub < 2.6) {
          const msg = atk === 0 ? "指令 [继续买表] → MISS（无法填补空虚）" : "指令 [手动上链] → 无效（时间不可逆转）";
          const fa = clamp(sub / 0.25, 0, 1) * clamp((2.6 - sub) / 0.45, 0, 1);
          const by = Math.round(426 - sub * 14);
          ctx.save();
          ctx.globalAlpha = alpha * fa;
          rrect(W / 2 - 330, by - 30, 660, 60, 12);
          ctx.fillStyle = "rgba(12, 14, 24, 0.90)";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "rgba(255, 110, 134, 0.82)";
          ctx.stroke();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = '800 28px "PingFang SC", sans-serif';
          ctx.fillStyle = "#ff8fa0";
          ctx.fillText(msg, W / 2, by);
          ctx.restore();
        }
      } else {
        // 211.0s – 218.04s: Stunning silent flatline impact!
        const fa = easeOut(clamp((t - 211.0) / 0.4, 0, 1));
        drawFloatText(W / 2, 460, "灵魂若变卖了 · 上链也没心跳（0 BPM）", "#faf8f4", fa, 40);
      }
      ctx.restore();
    }

    // FINAL (218.04 – 255.00): TRUE ENDING — UNEQUIPPING LUXURY GEAR & SUNRISE FREEDOM!
    function renderTrueEnding(t, alpha) {
      const lt = t - 218.04, p = clamp(lt / 36.96, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      drawBgPlate(IMGS.s16, lerp(1.13, 1.03, ease(p)), Math.round(lerp(-24, 24, p)), 0, 0.14);

      // Reverse Gameplay Mechanic: Player actively UNEQUIPPING watch & titles!
      const actions = [
        { at: 1.5,  end: 9.5,  txt: "✔ 已卸下装备：[ 黄金陀飞轮 ]", sub: "银或金，都不紧要了", col: "#ffd878" },
        { at: 10.5, end: 19.5, txt: "✔ 已退出副本：[ 无尽之塔 ]", sub: "计划了、照做了、得到了，如今选择放下", col: "#7cf29c" },
        { at: 21.5, end: 36.5, txt: "🏆 TRUE ENDING · 看破一生渺渺", sub: "昂贵是这刻我觉悟了 · 重新赢回自己", col: "#fff2ba" }
      ];
      for (const a of actions) {
        if (lt < a.at || lt > a.end) continue;
        const aa = Math.min(easeOut(clamp((lt - a.at) / 0.6, 0, 1)), ease(clamp((a.end - lt) / 0.6, 0, 1)));
        ctx.save();
        ctx.globalAlpha = alpha * aa;
        rrect(W / 2 - 380, 210, 760, 136, 16);
        ctx.fillStyle = "rgba(16, 14, 22, 0.86)";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = a.col;
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = '700 32px "PingFang SC", sans-serif';
        ctx.fillStyle = a.col;
        ctx.fillText(a.txt, W / 2, 258);
        ctx.font = '500 22px "PingFang SC", sans-serif';
        ctx.fillStyle = "#faf8f4";
        ctx.fillText(a.sub, W / 2, 308);
        ctx.restore();
      }
      ctx.restore();
    }

    // OUTRO (255.00 – 278.13): Full-Circle Game Clear Summary Card on Resting Tourbillon Workbench
    function renderOutro(t, alpha) {
      const lt = t - 255.00, p = clamp(lt / 23.13, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      drawBgPlate(IMGS.s1, lerp(1.14, 1.02, ease(p)), 0, 0, 0.45);

      const cardA = Math.min(easeOut(clamp((lt - 1.5) / 1.2, 0, 1)), ease(clamp((20.5 - lt) / 1.6, 0, 1)));
      if (cardA > 0.01) {
        ctx.save();
        ctx.globalAlpha = alpha * cardA;
        rrect(W / 2 - 420, 230, 840, 440, 18);
        ctx.fillStyle = "rgba(10, 12, 20, 0.88)";
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = "#ffd878";
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = '700 24px "DIN Alternate", sans-serif';
        ctx.fillStyle = "#ffd878";
        ctx.fillText("GAME CLEAR · 人生通关结算", W / 2, 286);
        ctx.font = '700 58px "Songti SC", "STSong", "PingFang SC", serif';
        ctx.fillStyle = "#fcf4de";
        ctx.fillText("陀  飞  轮", W / 2, 360);

        ctx.font = '600 25px "PingFang SC", sans-serif';
        ctx.fillStyle = "#e6eaf2";
        ctx.fillText(`通关玩家：${PLAYER_NAME}（LV.18 → LV.55）`, W / 2, 446);
        ctx.fillText("最终装备：[ 空无一物 ]", W / 2, 496);
        ctx.fillStyle = "#ffd878";
        ctx.fillText("解锁真结局：愿你拥有时间，也拥有自己", W / 2, 566);
        ctx.restore();
      }
      if (p > 0.85) {
        ctx.fillStyle = `rgba(8, 9, 18, ${(ease((p - 0.85) / 0.15) * 0.80).toFixed(2)})`;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    function drawSubtitles(t) {
      const barG = ctx.createLinearGradient(0, 925, 0, H);
      barG.addColorStop(0, "rgba(8, 8, 16, 0)");
      barG.addColorStop(0.32, "rgba(8, 8, 16, 0.82)");
      barG.addColorStop(1, "rgba(8, 8, 16, 0.96)");
      ctx.fillStyle = barG;
      ctx.fillRect(0, 925, W, H - 925);

      const lyrics = window.LYRICS || [];
      let cue = null;
      for (let i = 0; i < lyrics.length; i++) {
        if (t >= lyrics[i][0] && t <= lyrics[i][1]) { cue = lyrics[i]; break; }
      }
      if (!cue) return;
      const fi = clamp((t - cue[0]) / 0.15, 0, 1);
      const fo = clamp((cue[1] - t) / 0.15, 0, 1);
      const a = Math.min(fi, fo);
      const isCredit = t < 15.7;

      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = isCredit
        ? '500 32px "PingFang SC", "Hiragino Sans GB", sans-serif'
        : '600 44px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
      ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
      ctx.shadowBlur = 12;
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = "rgba(6, 6, 12, 0.92)";
      ctx.strokeText(cue[2], W / 2, 1016);
      ctx.fillStyle = isCredit ? "#f8d67a" : "#faf8f4";
      ctx.fillText(cue[2], W / 2, 1016);
      ctx.restore();
    }

    const STAGES = [
      { id: "s0",  t0: 0.0,    t1: 15.73,  fn: renderStage00 },
      { id: "s1a", t0: 15.73,  t1: 22.75,  fn: renderStage01Harbour },
      { id: "s1b", t0: 22.75,  t1: 29.85,  fn: renderStage01Alley },
      { id: "s2a", t0: 29.85,  t1: 35.48,  fn: renderStage02Overtime, wipe: "cyan" },
      { id: "s2b", t0: 35.48,  t1: 41.74,  fn: renderStage02Climb },
      { id: "s3a", t0: 41.74,  t1: 56.82,  fn: renderStage03Lootbox,  wipe: "gold" },
      { id: "s3b", t0: 56.82,  t1: 71.20,  fn: renderStage03Envy },
      { id: "s4a", t0: 71.20,  t1: 85.94,  fn: renderStage04Car },
      { id: "s4b", t0: 85.94,  t1: 102.95, fn: renderStage04Mirror },
      { id: "int", t0: 102.95, t1: 113.39, fn: renderInterlude },
      { id: "s5a", t0: 113.39, t1: 128.50, fn: renderStage05Tower },
      { id: "s5b", t0: 128.50, t1: 142.82, fn: renderStage05Backpack },
      { id: "s5c", t0: 142.82, t1: 171.84, fn: renderStage05Storm },
      { id: "s6a", t0: 171.84, t1: 189.58, fn: renderStage06Bridge },
      { id: "s6b", t0: 189.58, t1: 218.04, fn: renderStage06Boss },
      { id: "end", t0: 218.04, t1: 255.00, fn: renderTrueEnding },
      { id: "out", t0: 255.00, t1: 278.13, fn: renderOutro }
    ];
    const TRANS_HALF = 0.38;

    function findIdx(t) {
      for (let i = 0; i < STAGES.length; i++) {
        if (t >= STAGES[i].t0 && t < STAGES[i].t1) return i;
      }
      return STAGES.length - 1;
    }

    window.renderAt = function (t) {
      ctx.fillStyle = "#080912";
      ctx.fillRect(0, 0, W, H);

      const idx = findIdx(t);
      const sc = STAGES[idx];
      let scA = sc, scB = null, blend = 0;
      if (idx > 0 && (t - sc.t0) < TRANS_HALF) {
        scA = STAGES[idx - 1]; scB = sc;
        blend = 0.5 + 0.5 * ((t - sc.t0) / TRANS_HALF);
      } else if (idx < STAGES.length - 1 && (sc.t1 - t) < TRANS_HALF) {
        scA = sc; scB = STAGES[idx + 1];
        blend = 0.5 - 0.5 * ((sc.t1 - t) / TRANS_HALF);
      }

      if (scB) {
        const p = ease(clamp(blend, 0, 1));
        if (scB.wipe) {
          const splitX = Math.round((1 - p) * W);
          scA.fn(t, 1);
          ctx.save();
          ctx.beginPath(); ctx.rect(splitX, 0, W - splitX, H); ctx.clip();
          scB.fn(t, 1);
          ctx.restore();
          const g = ctx.createLinearGradient(splitX - 110, 0, splitX + 110, 0);
          if (scB.wipe === "cyan") {
            g.addColorStop(0, "rgba(110, 230, 255, 0)");
            g.addColorStop(0.5, "rgba(220, 250, 255, 0.85)");
            g.addColorStop(1, "rgba(110, 230, 255, 0)");
          } else {
            g.addColorStop(0, "rgba(255, 216, 120, 0)");
            g.addColorStop(0.5, "rgba(255, 242, 190, 0.85)");
            g.addColorStop(1, "rgba(255, 216, 120, 0)");
          }
          ctx.fillStyle = g;
          ctx.fillRect(splitX - 110, 0, 220, H);
        } else {
          scA.fn(t, 1);
          scB.fn(t, p);
        }
      } else {
        sc.fn(t, 1);
      }

      drawGameHUD(t);
      drawSubtitles(t);
      return stage.toDataURL("image/jpeg", 0.94);
    };

    window.sceneReady = false;
    loadAll().then(() => {
      window.renderAt(0);
      window.sceneReady = true;
    });
  </script>
</body>
</html>
